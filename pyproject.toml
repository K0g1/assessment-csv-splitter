[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-csv-splitter"
version = "1.0.0"
description = "Losslessly split six combined assessment CSV exports into patient and assessment folder trees."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kevin Deng" }]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/K0g1/assessment-csv-splitter"
Repository = "https://github.com/K0g1/assessment-csv-splitter"
Issues = "https://github.com/K0g1/assessment-csv-splitter/issues"
Changelog = "https://github.com/K0g1/assessment-csv-splitter/blob/main/CHANGELOG.md"

[project.scripts]
assessment-csv-splitter = "assessment_csv_splitter.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pyinstaller>=6.12",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["assessment_csv_splitter"]
mypy_path = "src"
